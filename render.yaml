services:
  - type: web
    name: task-flow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: APP_ENV
        value: production
